services:
  db:
    image: postgres:16
    container_name: moncopulli_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in el entorno o en .env}
      POSTGRES_DB: moncopulliBD
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: